# Mosquitto MQTT Broker — BukuPay Development Config

# ============================================================
# Listeners
# ============================================================

# MQTT plaintext (hanya untuk development/lokal)
listener 1883
protocol mqtt

# WebSocket (untuk debug via browser)
listener 9001
protocol websockets

# ============================================================
# Security
# ============================================================

# Wajib autentikasi
allow_anonymous false
password_file /mosquitto/config/passwd

# ============================================================
# Persistence
# ============================================================
persistence true
persistence_location /mosquitto/data/

# ============================================================
# Logging
# ============================================================
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type information
log_timestamp true

# ============================================================
# Connection limits
# ============================================================
max_connections 1000
max_inflight_messages 20

# ============================================================
# Message size (max 64KB per MQTT message)
# ============================================================
message_size_limit 65536
