# ============================================================
# docker/nginx/conf.d/bukupay.conf — Virtual Host Config
#
# Routes:
#   http://localhost/api/*    → backend:3000
#   http://localhost/webhooks/* → backend:3000  (higher rate limit)
#   http://localhost/*        → web:3001 (Next.js dashboard)
# ============================================================

# HTTP → redirect everything to HTTPS (production)
# For local dev, serve on HTTP directly
server {
  listen 80;
  server_name localhost _;

  # Health check endpoint (untuk load balancer/Docker healthcheck)
  location /nginx-health {
    access_log off;
    return 200 'healthy\n';
    add_header Content-Type text/plain;
  }

  # ─── Xendit Webhooks — High rate limit, no auth ─────────────
  location /webhooks/ {
    limit_req zone=webhook_limit burst=50 nodelay;

    proxy_pass http://backend_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Webhook needs to receive raw body for signature verification
    proxy_request_buffering off;
    proxy_buffering off;
  }

  # ─── Auth endpoints — strict rate limit ─────────────────────
  location ~ ^/api/v1/(auth|otp) {
    limit_req zone=auth_limit burst=10 nodelay;
    limit_req_status 429;

    proxy_pass http://backend_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }

  # ─── API — General ──────────────────────────────────────────
  location /api/ {
    limit_req zone=api_limit burst=60 nodelay;

    proxy_pass http://backend_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Timeout untuk export CSV (streaming)
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # Buffer settings
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
  }

  # ─── Next.js Static Files — Cache aggressively ──────────────
  location /_next/static/ {
    proxy_pass http://web_dashboard;
    proxy_cache_valid 200 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Cache-Status "HIT";
  }

  location /favicon.ico {
    proxy_pass http://web_dashboard;
    add_header Cache-Control "public, max-age=86400";
    access_log off;
  }

  # ─── Web Dashboard — All other routes ───────────────────────
  location / {
    proxy_pass http://web_dashboard;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";  # WebSocket support untuk Next.js HMR (dev)

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
  }
}

