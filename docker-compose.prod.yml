version: '3.9'

# ============================================================
# docker-compose.prod.yml — Production overrides
#
# Usage:
#   docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ============================================================

services:

  postgres:
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    # In production, don't expose DB port to host
    ports: !reset []
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G

  redis:
    ports: !reset []
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  backend:
    # Use pre-built image from registry instead of building locally
    image: ${REGISTRY:-ghcr.io}/bukupay/backend:${VERSION:-latest}
    build: !reset null
    environment:
      NODE_ENV: production
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1'
          memory: 512M
      restart_policy:
        condition: on-failure
        max_attempts: 3

  web:
    image: ${REGISTRY:-ghcr.io}/bukupay/web:${VERSION:-latest}
    build: !reset null
    environment:
      NODE_ENV: production
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # Add Caddy for automatic HTTPS in production (alternative to nginx+certbot)
  caddy:
    image: caddy:2-alpine
    container_name: bukupay_caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - web
    networks:
      - bukupay_external

volumes:
  caddy_data:
  caddy_config:
