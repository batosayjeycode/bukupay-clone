name: CI — Lint, Test, Build Check

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: bukupay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Generate Prisma Client
        run: npm run generate --workspace=apps/backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/bukupay_test
      - name: Run Prisma Migrations
        run: npm run migrate --workspace=apps/backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/bukupay_test
      - name: Run Unit Tests
        run: npm run test:unit --workspace=apps/backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/bukupay_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret
          JWT_REFRESH_SECRET: test_refresh_secret
      - name: Run Integration Tests
        run: npm run test:integration --workspace=apps/backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/bukupay_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret
          JWT_REFRESH_SECRET: test_refresh_secret

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Verify backend starts
        run: |
          cd apps/backend
          node -e "require('./src/app')"
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test
          JWT_REFRESH_SECRET: test
