name: Deploy iOS

on:
  push:
    branches:
      - main
      - release/ios-*
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/deploy-ios.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      build_type:
        description: 'Build type'
        required: true
        default: 'testflight'
        type: choice
        options:
          - testflight
          - appstore

concurrency:
  group: ios-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Build & Test ────────────────────────────────────────────────────────────
  test:
    name: 🧪 Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/mobile

      - name: Lint
        run: npm run lint --if-present
        working-directory: apps/mobile

      - name: Type check
        run: npm run typecheck --if-present
        working-directory: apps/mobile

  # ─── iOS Build (macOS runner) ────────────────────────────────────────────────
  build-ios:
    name: 🍎 Build iOS
    runs-on: macos-14  # Apple Silicon — lebih cepat dari macos-latest Intel
    needs: test
    timeout-minutes: 60

    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || 'staging' }}
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'testflight' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install JS dependencies
        run: npm ci
        working-directory: apps/mobile

      # ─── Apple Certificates & Provisioning Profiles ─────────────────────
      - name: Import Code Signing Certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Install Provisioning Profile
        env:
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/BukuPay.mobileprovision
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PP_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      # ─── Cocoapods ───────────────────────────────────────────────────────
      - name: Cache Cocoapods
        uses: actions/cache@v4
        with:
          path: apps/mobile/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('apps/mobile/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install Pods
        run: pod install --repo-update
        working-directory: apps/mobile/ios

      # ─── Set version number ──────────────────────────────────────────────
      - name: Set Build Number
        run: |
          BUILD_NUM=${{ github.run_number }}
          agvtool new-version -all $BUILD_NUM
        working-directory: apps/mobile/ios

      # ─── Build & Archive ────────────────────────────────────────────────
      - name: Build iOS Archive
        env:
          CODE_SIGN_IDENTITY: "Apple Distribution"
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -workspace BukuPay.xcworkspace \
            -scheme BukuPay \
            -configuration Release \
            -archivePath $RUNNER_TEMP/BukuPay.xcarchive \
            -destination generic/platform=iOS \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="BukuPay Distribution" \
            | xcpretty
        working-directory: apps/mobile/ios

      # ─── Export IPA ──────────────────────────────────────────────────────
      - name: Create ExportOptions.plist
        run: |
          METHOD=$([[ "$BUILD_TYPE" == "appstore" ]] && echo "app-store" || echo "app-store")
          cat > $RUNNER_TEMP/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>$METHOD</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>uploadBitcode</key>
            <false/>
            <key>compileBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>id.bukupay.app</key>
              <string>BukuPay Distribution</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/BukuPay.xcarchive \
            -exportPath $RUNNER_TEMP/BukuPay-IPA \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            | xcpretty

      # ─── Upload to TestFlight / App Store Connect ─────────────────────
      - name: Upload to App Store Connect
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          # Decode API key
          echo "$ASC_API_KEY_BASE64" | base64 --decode > $RUNNER_TEMP/AuthKey_${ASC_API_KEY_ID}.p8

          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/BukuPay-IPA/BukuPay.ipa" \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_API_ISSUER_ID" \
            --private-key-path "$RUNNER_TEMP/AuthKey_${ASC_API_KEY_ID}.p8" \
            --verbose

      # ─── Notify ─────────────────────────────────────────────────────────
      - name: Slack Notification — Success
        if: success()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "✅ *BukuPay iOS Build Berhasil!*\nEnvironment: `${{ env.ENVIRONMENT }}`\nBuild: `#${{ github.run_number }}`\nBranch: `${{ github.ref_name }}`\nDiupload ke TestFlight 🚀"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

      - name: Slack Notification — Failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "❌ *BukuPay iOS Build Gagal!*\nBranch: `${{ github.ref_name }}`\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

      # ─── Upload artifact jika ada kegagalan ─────────────────────────────
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs-${{ github.run_number }}
          path: ${{ runner.temp }}/
          retention-days: 7
